<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assemblage — reference boards for PureRef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Neutral mid-gray field: images get judged against it, so it must not
       bias perceived exposure the way black or white does. */
    --field:#c9ccc9;
    --panel:#e4e6e3;
    --panel-2:#dcdfdb;
    --well:#b2b7b4;
    --rule:#9aa19d;
    --rule-soft:#b8bdb9;
    --ink:#15191a;
    --ink-2:#3d4644;
    --muted:#5d6764;
    --accent:#17475f;      /* drafting ink */
    --alert:#8a3116;
    --r:2px;
    --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Public Sans',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:var(--field);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:24px 20px 80px;
  }
  @media(max-width:640px){ body{padding:14px 12px 60px} }

  .shell{max-width:940px;margin:0 auto}

  /* ---------- title block ---------- */

  .titleblock{
    border:1.5px solid var(--ink);
    background:var(--panel);
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 132px;
  }
  @media(max-width:640px){
    .titleblock{grid-template-columns:1fr 1fr}
    .titleblock .tb-span{grid-column:1 / -1;border-right:0;border-bottom:1px solid var(--rule)}
  }

  .tb-cell{padding:12px 14px;border-right:1px solid var(--rule);min-width:0}
  .tb-cell:last-child{border-right:0}

  .tb-key{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:5px;
  }
  .tb-val{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
  }

  .wordmark{
    font-family:var(--mono);
    font-weight:500;
    font-size:19px;
    letter-spacing:.22em;
    text-transform:uppercase;
    line-height:1;
    display:block;
  }
  .tagline{font-size:12.5px;color:var(--muted);margin-top:7px}

  /* ---------- command panel ---------- */

  .panel{
    border:1px solid var(--rule);
    border-top:0;
    background:var(--panel-2);
    padding:16px;
  }

  .fieldkey{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:7px;
  }

  #prompt{
    width:100%;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:var(--r);
    padding:11px 12px;
    font-family:var(--sans);
    font-size:15px;
    line-height:1.45;
    color:var(--ink);
    resize:vertical;
    min-height:70px;
  }
  #prompt::placeholder{color:#7d8582}
  #prompt:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

  .examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}

  .chip{
    font-family:var(--mono);
    font-size:11.5px;
    background:var(--panel);
    border:1px solid var(--rule-soft);
    border-radius:var(--r);
    padding:4px 8px;
    color:var(--ink-2);
    cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--rule-soft);
  }

  .countwrap{display:flex;align-items:center;gap:10px}
  .countwrap .fieldkey{margin:0}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:112px;height:2px;background:var(--rule);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--ink);border:2px solid var(--panel-2);
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;
    background:var(--ink);border:2px solid var(--panel-2);
  }
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  .countval{font-family:var(--mono);font-size:13px;width:20px}

  .primary{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--panel);
    border:1px solid var(--ink);
    border-radius:var(--r);
    padding:9px 16px;
    cursor:pointer;
    display:flex;align-items:center;gap:9px;
  }
  .primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
  .primary:disabled{opacity:.4;cursor:not-allowed}
  .primary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .primary kbd{
    font-family:var(--mono);font-size:10px;opacity:.6;
    border:1px solid currentColor;border-radius:2px;padding:0 3px;
  }

  /* ---------- progress ---------- */

  .progress{border:1px solid var(--rule);border-top:0;background:var(--panel-2);padding:11px 16px}
  .progress[hidden]{display:none}

  .progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

  .stagelist{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .stagelist span{white-space:nowrap}
  .stagelist .done{color:var(--ink-2)}
  .stagelist .now{color:var(--accent)}
  .stagelist .now::after{
    content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);margin-left:6px;vertical-align:middle;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

  .track{height:2px;background:var(--well);margin-top:10px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

  .queries{margin-top:11px;padding-top:10px;border-top:1px solid var(--rule-soft);display:grid;gap:5px}
  .queries[hidden]{display:none}
  .qrow{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:9px}
  .qrow b{color:var(--ink-2);font-weight:500;min-width:120px;flex-shrink:0}
  .qrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- result bar ---------- */

  .resultbar{
    border:1px solid var(--rule);border-top:0;background:var(--panel);
    padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
    gap:14px;flex-wrap:wrap;
  }
  .resultbar[hidden]{display:none}
  .resultbar .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}

  .download{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--ink);border-radius:var(--r);padding:7px 13px;
    color:var(--ink);text-decoration:none;
  }
  .download:hover{background:var(--ink);color:var(--panel)}
  .download:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- slot bands ---------- */

  /* minmax(0,1fr) plus min-width:0 on the item: grid and flex children default
     to min-width:auto, which means they refuse to shrink below their content's
     intrinsic width and push the page wider than the viewport. */
  .bands{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

  .band{border:1px solid var(--rule);background:var(--panel-2);min-width:0}

  .band-head{display:flex;align-items:baseline;gap:12px;padding:9px 13px;border-bottom:1px solid var(--rule-soft)}
  .band-name{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
  .band-what{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .band-count{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .band-body{padding:11px 13px;display:flex;flex-wrap:wrap;gap:9px;min-height:64px;align-items:center}

  .thumb{
    height:128px;background:var(--well);border:1px solid var(--rule-soft);border-radius:var(--r);
    padding:0;cursor:zoom-in;overflow:hidden;line-height:0;display:block;
  }
  .thumb img{height:100%;width:auto;max-width:230px;object-fit:contain;display:block;opacity:0;transition:opacity .25s ease}
  .thumb img.in{opacity:1}
  .thumb:hover{border-color:var(--accent)}
  .thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .slot-empty{font-size:12.5px;color:var(--muted);font-style:italic}

  .ghostframe{
    height:64px;width:88px;border:1px dashed var(--rule);border-radius:var(--r);
    background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--rule-soft) 6px,var(--rule-soft) 7px);
    opacity:.45;
  }

  /* ---------- lightbox ---------- */

  .lb{position:fixed;inset:0;background:rgba(21,25,26,.93);z-index:50;display:flex;align-items:center;justify-content:center;padding:60px 22px}
  .lb[hidden]{display:none}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;background:var(--well)}

  .lb-bar{
    position:absolute;top:0;left:0;right:0;padding:12px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    font-family:var(--mono);font-size:11.5px;color:var(--panel);
  }
  .lb-bar .meta{display:flex;gap:14px;align-items:center;min-width:0}
  .lb-bar .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-bar a,.lb-bar button{
    font-family:var(--mono);font-size:11.5px;color:var(--panel);background:transparent;
    border:1px solid rgba(228,230,227,.4);border-radius:var(--r);padding:4px 9px;
    cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  .lb-bar a:hover,.lb-bar button:hover{border-color:var(--panel)}
  .lb-bar a:focus-visible,.lb-bar button:focus-visible{outline:2px solid var(--panel);outline-offset:2px}
  .lb-actions{display:flex;gap:8px;flex-shrink:0}

  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:transparent;border:1px solid rgba(228,230,227,.4);border-radius:var(--r);
    color:var(--panel);width:36px;height:52px;cursor:pointer;font-size:17px;line-height:1;
  }
  .lb-nav:hover{border-color:var(--panel)}
  .lb-nav:focus-visible{outline:2px solid var(--panel);outline-offset:2px}
  .lb-prev{left:14px}
  .lb-next{right:14px}

  /* ---------- misc ---------- */

  .error{border:1px solid var(--alert);border-top:0;background:var(--panel);padding:12px 16px;font-size:13.5px;color:var(--alert)}
  .error[hidden]{display:none}
  .error b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}

  footer{
    margin-top:30px;padding-top:14px;border-top:1px solid var(--rule-soft);
    font-family:var(--mono);font-size:11px;color:var(--muted);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  footer a{color:var(--muted)}

  @media(max-width:640px){
    /* The slot description is the first thing to go when space is tight;
       the slot name alone still identifies the band. */
    .band-what{display:none}
    .thumb{height:104px}
    .thumb img{max-width:160px}
  }

  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .thumb img{opacity:1}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- Title block: the boxed field grid in the corner of every technical
       drawing. Here the fields carry live state instead of being decoration. -->
  <header class="titleblock">
    <div class="tb-cell tb-span">
      <span class="wordmark">Assemblage</span>
      <p class="tagline">Four kinds of reference, gathered and laid out for PureRef.</p>
    </div>
    <div class="tb-cell">
      <span class="tb-key">Subject</span>
      <span class="tb-val" id="tbSubject">—</span>
    </div>
    <div class="tb-cell">
      <span class="tb-key">Sheet</span>
      <span class="tb-val" id="tbSheet">— / 12</span>
    </div>
  </header>

  <section class="panel">
    <label class="fieldkey" for="prompt">What are you modelling</label>
    <textarea id="prompt" rows="2" placeholder="Victorian crown molding"></textarea>

    <div class="examples" id="examples"></div>

    <div class="controls">
      <div class="countwrap">
        <label class="fieldkey" for="count">Images</label>
        <input id="count" type="range" min="4" max="20" step="4" value="12">
        <span class="countval" id="countVal">12</span>
      </div>
      <button class="primary" id="genBtn" type="button">
        <span>Assemble board</span>
        <kbd>&#9166;</kbd>
      </button>
    </div>
  </section>

  <section class="progress" id="progress" hidden aria-live="polite">
    <div class="progress-top">
      <div class="stagelist" id="stages"></div>
      <button class="chip ghost" id="qToggle" type="button">Searches</button>
    </div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="queries" id="queries" hidden></div>
  </section>

  <section class="error" id="error" hidden role="alert">
    <b>Stopped</b>
    <span id="errorText"></span>
  </section>

  <section class="resultbar" id="resultbar" hidden>
    <div>
      <p id="resultText">Board ready.</p>
      <p class="sub" id="resultSub"></p>
    </div>
    <a class="download" id="downloadLink" href="#" download>Download .pur</a>
  </section>

  <!-- The four bands exist before any results do, so an empty screen still
       explains what the tool is about to give you. -->
  <div class="bands" id="bands"></div>

  <footer>
    <span>Runs locally &middot; no account, no API keys</span>
    <span><a href="https://github.com/FyorDev/PureRef-format">.pur format by Fyor</a></span>
  </footer>
</div>

<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Reference image">
  <div class="lb-bar">
    <div class="meta">
      <span id="lbSlot"></span>
      <span id="lbCount"></span>
      <span id="lbSource"></span>
    </div>
    <div class="lb-actions">
      <a id="lbOpen" href="#" target="_blank" rel="noopener noreferrer">Open original</a>
      <button id="lbCopy" type="button">Copy link</button>
      <button id="lbClose" type="button">Close</button>
    </div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous image">&#8592;</button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next image">&#8594;</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
"use strict";

/* Mirrors backend/slots.py. Order matches SLOT_ORDER. */
const SLOTS = [
  { id:"hero",     name:"Form & silhouette",      what:"whole object, three-quarter view" },
  { id:"ortho",    name:"Orthographic",           what:"blueprints, elevations, cross-sections" },
  { id:"detail",   name:"Joinery & construction", what:"corners, seams, how it goes together" },
  { id:"material", name:"Material & surface",     what:"macro texture, wear, roughness" }
];

const STAGES = ["Read","Searches built","Searching","Filtering","Sorting","Packing"];

const EXAMPLES = [
  "Victorian crown molding",
  "Double wishbone suspension",
  "Cedar platform bed frame",
  "Gothic ribbed groin vault",
  "1920s brass cash register",
  "Redwood bark and root system",
  "Damascus steel falchion",
  "Brutalist cantilever staircase",
  "Industrial cooling vent housing",
  "Wire wrapped sword hilt"
];

const $ = id => document.getElementById(id);
let previews = [];
let lbIndex = 0;
let running = false;

/* ---------- setup ---------- */

function buildBands(){
  $("bands").innerHTML = SLOTS.map(s => `
    <section class="band" data-slot="${s.id}">
      <div class="band-head">
        <span class="band-name">${s.name}</span>
        <span class="band-what">${s.what}</span>
        <span class="band-count" data-count>&mdash;</span>
      </div>
      <div class="band-body" data-body>
        <div class="ghostframe"></div><div class="ghostframe"></div><div class="ghostframe"></div>
      </div>
    </section>`).join("");
}

function buildStages(){
  $("stages").innerHTML = STAGES
    .map((s,i)=>`<span data-stage="${i+1}">${i+1} ${s}</span>`).join("");
}

function buildExamples(){
  const picks = [...EXAMPLES].sort(()=>Math.random()-0.5).slice(0,3);
  const box = $("examples");
  box.innerHTML = "";
  picks.forEach(text=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.onclick = ()=>{ $("prompt").value = text; $("prompt").focus(); syncSubject(); };
    box.appendChild(b);
  });
  const shuffle = document.createElement("button");
  shuffle.type = "button";
  shuffle.className = "chip ghost";
  shuffle.textContent = "Other ideas";
  shuffle.onclick = buildExamples;
  box.appendChild(shuffle);
}

function syncSubject(){
  const v = $("prompt").value.trim();
  $("tbSubject").textContent = v || "\u2014";
  $("genBtn").disabled = !v || running;
}

/* ---------- progress ---------- */

function setStage(n){
  $("stages").querySelectorAll("[data-stage]").forEach(el=>{
    const i = +el.dataset.stage;
    el.className = i < n ? "done" : (i === n ? "now" : "");
  });
  $("bar").style.width = Math.round((n / STAGES.length) * 100) + "%";
}

function showError(msg){
  $("errorText").textContent = msg;
  $("error").hidden = false;
}

/* ---------- results ---------- */

/* Older builds of app.py sent previews as bare URL strings with no slot tag.
   Rather than silently rendering four empty bands, detect that shape, keep the
   images visible, and say what to update. */
let serverOutOfDate = false;

function normalisePreviews(raw){
  const list = raw || [];
  serverOutOfDate = list.length > 0 && typeof list[0] === "string";
  if(!serverOutOfDate) return list;
  return list.map(u => ({ url:u, slot:null, label:"Reference", source:"" }));
}


function renderBoard(){
  if(serverOutOfDate){
    showError("Images loaded, but this server build does not tag them by slot. "
            + "Replace app.py with the matching version to group results.");
  }
  SLOTS.forEach(slot=>{
    const band = document.querySelector('.band[data-slot="' + slot.id + '"]');
    const body = band.querySelector("[data-body]");
    const count = band.querySelector("[data-count]");
    // With an out-of-date server nothing carries a slot, so show everything in
    // the first band instead of four empty ones.
    const mine = serverOutOfDate
      ? (slot.id === SLOTS[0].id ? previews : [])
      : previews.filter(p => p.slot === slot.id);

    count.textContent = String(mine.length);
    body.innerHTML = "";

    if(!mine.length){
      const p = document.createElement("p");
      p.className = "slot-empty";
      p.textContent = slot.id === "ortho"
        ? "No technical drawings found for this subject."
        : "Nothing passed the filters for this slot.";
      body.appendChild(p);
      return;
    }

    mine.forEach(item=>{
      const idx = previews.indexOf(item);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "thumb";
      btn.setAttribute("aria-label", slot.name + " reference, open larger");
      btn.onclick = ()=>openLightbox(idx);
      const img = new Image();
      img.loading = "lazy";
      img.alt = "";
      img.onload = ()=>img.classList.add("in");
      img.onerror = ()=>btn.remove();
      img.src = item.url;
      btn.appendChild(img);
      body.appendChild(btn);
    });
  });
}

/* ---------- lightbox ---------- */

function hostOf(u){
  try { return new URL(u).hostname.replace(/^www\./,""); }
  catch(e){ return "source"; }
}

function openLightbox(i){
  if(!previews.length) return;
  lbIndex = i;
  paintLightbox();
  $("lightbox").hidden = false;
  $("lbClose").focus();
}

function paintLightbox(){
  const item = previews[lbIndex];
  $("lbImg").src = item.url;
  $("lbSlot").textContent = item.label;
  $("lbCount").textContent = (lbIndex + 1) + " / " + previews.length;
  $("lbSource").textContent = hostOf(item.source)
    + (item.subject != null ? "  \u00b7  subject " + item.subject.toFixed(3) : "");
  $("lbOpen").href = item.source;
}

function closeLightbox(){
  $("lightbox").hidden = true;
  $("lbImg").src = "";
}

function stepLightbox(d){
  lbIndex = (lbIndex + d + previews.length) % previews.length;
  paintLightbox();
}

/* ---------- run ---------- */

async function run(){
  const prompt = $("prompt").value.trim();
  if(!prompt || running) return;

  running = true;
  $("genBtn").disabled = true;
  $("error").hidden = true;
  $("resultbar").hidden = true;
  $("progress").hidden = false;
  $("queries").hidden = true;
  $("queries").innerHTML = "";
  previews = [];
  buildBands();
  setStage(1);
  $("tbSheet").textContent = "\u2014 / " + $("count").value;

  try{
    const res = await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ prompt: prompt, target_count: parseInt($("count").value,10) })
    });
    if(!res.ok) throw new Error("server returned " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while(true){
      const chunk = await reader.read();
      if(chunk.done) break;
      buffer += decoder.decode(chunk.value,{stream:true});
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for(const frame of frames){
        const line = frame.trim();
        if(!line.startsWith("data: ")) continue;
        const data = JSON.parse(line.slice(6));

        if(data.stage) setStage(data.stage);

        if(data.queries){
          $("queries").innerHTML = data.queries.map(q =>
            '<div class="qrow"><b>' + q.label + '</b><span>' + q.query + '</span></div>'
          ).join("");
        }

        if(data.error){
          showError(data.error);
          $("progress").hidden = true;
        }

        if(data.complete){
          setStage(STAGES.length);
          $("progress").hidden = true;
          previews = normalisePreviews(data.previews);
          renderBoard();
          $("tbSheet").textContent = data.count + " / " + $("count").value;
          $("resultText").textContent = "Board ready and opened in PureRef.";
          $("resultSub").textContent = Object.entries(data.breakdown || {})
            .map(function(e){ return e[0] + " " + e[1]; }).join("   \u00b7   ");
          $("downloadLink").href = data.download_url;
          $("resultbar").hidden = false;
        }
      }
    }
  }catch(err){
    $("progress").hidden = true;
    showError("Lost the connection to the server. Is it still running? (" + err.message + ")");
  }finally{
    running = false;
    syncSubject();
  }
}

/* ---------- wiring ---------- */

buildBands();
buildStages();
buildExamples();
syncSubject();

$("prompt").addEventListener("input", syncSubject);
$("prompt").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); run(); }
});
$("count").addEventListener("input", function(e){
  $("countVal").textContent = e.target.value;
  if($("resultbar").hidden) $("tbSheet").textContent = "\u2014 / " + e.target.value;
});
$("genBtn").addEventListener("click", run);
$("qToggle").addEventListener("click", function(){
  $("queries").hidden = !$("queries").hidden;
});

$("lbClose").addEventListener("click", closeLightbox);
$("lbPrev").addEventListener("click", function(){ stepLightbox(-1); });
$("lbNext").addEventListener("click", function(){ stepLightbox(1); });
$("lightbox").addEventListener("click", function(e){
  if(e.target === $("lightbox")) closeLightbox();
});
$("lbCopy").addEventListener("click", async function(){
  try{
    await navigator.clipboard.writeText(previews[lbIndex].source);
    $("lbCopy").textContent = "Copied";
    setTimeout(function(){ $("lbCopy").textContent = "Copy link"; }, 1400);
  }catch(e){
    $("lbCopy").textContent = "Copy failed";
    setTimeout(function(){ $("lbCopy").textContent = "Copy link"; }, 1400);
  }
});

document.addEventListener("keydown", function(e){
  if($("lightbox").hidden){
    if((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
    return;
  }
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowRight") stepLightbox(1);
  if(e.key === "ArrowLeft") stepLightbox(-1);
});
</script>
