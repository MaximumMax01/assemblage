<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCA — PureRef Moodboard Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col items-center p-6 sm:p-10 antialiased selection:bg-zinc-800">

  <div class="w-full max-w-2xl space-y-6">

    <!-- Header -->
    <div class="flex items-baseline justify-between border-b border-zinc-800/80 pb-4">
      <div>
        <h1 class="text-lg font-semibold tracking-tight text-white">ARCA</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Automated reference curation for PureRef</p>
      </div>
      <span class="text-[11px] text-zinc-400 font-mono">v1.3</span>
    </div>

    <!-- Main Input Card -->
    <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-4 space-y-4 shadow-sm">
      
      <div class="relative">
        <textarea id="prompt" rows="3"
          placeholder="Describe your subject (e.g., Victorian crown molding, Cedar bed frame, 90s sports car chassis)..."
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3.5 text-sm text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-zinc-700 transition resize-none leading-relaxed"
          onkeydown="handleKey(event)"></textarea>
      </div>

      <!-- Dynamic Prompts with Shuffle -->
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 flex-wrap flex-1" id="promptChips"></div>
        <button onclick="shufflePrompts()" title="Shuffle prompt ideas" class="text-zinc-400 hover:text-zinc-200 transition ml-2 p-1 text-xs flex items-center gap-1 border border-zinc-800 rounded px-2 py-0.5 bg-zinc-950">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Shuffle</span>
        </button>
      </div>

      <!-- Controls & Submit Row -->
      <div class="flex items-center justify-between pt-2 border-t border-zinc-800/60">
        <div class="flex items-center gap-3">
          <label for="count" class="text-xs text-zinc-400">Target Count</label>
          <div class="flex items-center gap-2">
            <input id="count" type="range" min="6" max="18" step="3" value="12"
              class="w-24 accent-white h-1 bg-zinc-800 rounded cursor-pointer"
              oninput="document.getElementById('countVal').innerText = this.value">
            <span id="countVal" class="text-xs font-mono text-zinc-300 w-4">12</span>
          </div>
        </div>

        <button id="genBtn" onclick="runPipeline()"
          class="bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-xs px-4 py-2 rounded-lg transition active:scale-[0.98] flex items-center gap-1.5 shadow-sm">
          <span>Generate Board</span>
          <span class="text-[10px] text-zinc-600 font-mono">↵</span>
        </button>
      </div>

    </div>

    <!-- Live Execution Status -->
    <div id="statusContainer" class="hidden space-y-3">
      <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between text-xs">
          <span id="statusLabel" class="text-zinc-300 font-medium flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-pulse"></span>
            Starting search...
          </span>
          <button onclick="toggleLogs()" id="logToggleBtn" class="text-zinc-400 hover:text-zinc-300 transition text-[11px]">
            View Details
          </button>
        </div>

        <div class="w-full h-1 bg-zinc-950 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-zinc-300 transition-all duration-300 w-0"></div>
        </div>

        <div id="detailsBox" class="hidden pt-2 border-t border-zinc-800/60 font-mono text-[11px] text-zinc-400 space-y-1 max-h-32 overflow-y-auto">
        </div>
      </div>
    </div>

    <!-- Result Box & Image Preview Grid -->
    <div id="resultContainer" class="hidden space-y-4">
      <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-white">Board Created & Opened in PureRef</p>
          <p id="resultDesc" class="text-[11px] text-zinc-400">12 verified reference assets packed.</p>
        </div>
        <a id="downloadLink" href="#"
          class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3.5 py-1.5 rounded-lg border border-zinc-700/60 transition">
          Download .pur
        </a>
      </div>

      <!-- Interactive Preview Grid -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <p class="text-xs text-zinc-400 font-medium">Curated Canvas Preview</p>
          <span class="text-[11px] text-zinc-500 font-mono">Click image to expand · ← → to navigate</span>
        </div>
        <div id="previewGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-3">
        </div>
      </div>
    </div>

  </div>

  <!-- Interactive Lightbox Modal with Arrow Navigation -->
  <div id="imageModal" 
    class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 sm:p-8 hidden opacity-0 transition-opacity duration-200"
    onclick="closeModal()">
    
    <!-- Top Modal Header Bar -->
    <div class="absolute top-4 inset-x-4 sm:inset-x-8 flex items-center justify-between pointer-events-none">
      <span id="modalCounter" class="text-xs font-mono text-zinc-400 bg-zinc-900/80 px-2.5 py-1 rounded-md border border-zinc-800 pointer-events-auto">1 / 12</span>
      
      <div class="flex items-center gap-2 pointer-events-auto">
        <button onclick="closeModal()" class="text-zinc-400 hover:text-white text-xs font-mono flex items-center gap-1.5 bg-zinc-900/80 px-2.5 py-1 rounded-md border border-zinc-800 transition">
          <span>Close</span>
          <kbd class="bg-zinc-800 px-1.5 py-0.5 rounded text-[10px] text-zinc-300">ESC</kbd>
        </button>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <button onclick="prevImage(event)" class="absolute left-4 sm:left-8 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 p-2.5 rounded-full transition shadow-xl z-10 flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </button>

    <button onclick="nextImage(event)" class="absolute right-4 sm:right-8 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 p-2.5 rounded-full transition shadow-xl z-10 flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </button>

    <!-- Main Image Container -->
    <div class="relative max-w-4xl max-h-[82vh] flex flex-col items-center select-none" onclick="event.stopPropagation()">
      <img id="modalImg" src="" alt="Reference Preview" 
        class="max-w-full max-h-[80vh] object-contain rounded-lg border border-zinc-800 shadow-2xl transition duration-150">
    </div>
  </div>

  <script>
    const PROMPT_BANK = [
      { label: "Crown Molding", query: "Victorian crown molding cross section and corner joinery" },
      { label: "Cedar Bed", query: "Cedar platform bed frame with headboard joinery" },
      { label: "Tree Bark", query: "Pine tree bark and exposed root photogrammetry scan" },
      { label: "Car Suspension", query: "Sports car double wishbone suspension and brake caliper" },
      { label: "Hydraulic Valve", query: "Soviet hydropneumatic pressure valve and brass fittings" },
      { label: "Cantilever Staircase", query: "Brutalist concrete cantilever staircase structural detail" },
      { label: "Sci-Fi Generator", query: "Cyberpunk industrial cooling vents and power conduit" },
      { label: "Damascus Sword", query: "Damascus steel falchion with wire wrapped hilt" },
      { label: "Riverbed Forest", query: "Riverbed redwood forest with mossy boulders" },
      { label: "Cash Register", query: "1920s mechanical brass cash register gear mechanism" },
      { label: "Gothic Vault", query: "Gothic cathedral ribbed groin vault stone masonry" },
      { label: "Robot Chassis", query: "Dieselpunk walking robot joint linkage and piston" }
    ];

    let currentPreviews = [];
    let currentIndex = 0;

    function shufflePrompts() {
      const container = document.getElementById('promptChips');
      container.innerHTML = '<span class="text-zinc-400 mr-1">Try:</span>';
      const shuffled = [...PROMPT_BANK].sort(() => 0.5 - Math.random()).slice(0, 4);
      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'text-xs text-zinc-400 hover:text-zinc-200 bg-zinc-950 hover:bg-zinc-800/60 border border-zinc-800 px-2.5 py-1 rounded-md transition';
        btn.innerText = item.label;
        btn.onclick = () => setPrompt(item.query);
        container.appendChild(btn);
      });
    }

    shufflePrompts();

    function setPrompt(text) {
      document.getElementById('prompt').value = text;
      document.getElementById('prompt').focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        runPipeline();
      }
    }

    function toggleLogs() {
      const box = document.getElementById('detailsBox');
      const btn = document.getElementById('logToggleBtn');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        btn.innerText = 'Hide Details';
      } else {
        box.classList.add('hidden');
        btn.innerText = 'View Details';
      }
    }

    function addLogDetail(text) {
      const box = document.getElementById('detailsBox');
      const p = document.createElement('p');
      p.innerText = text;
      box.appendChild(p);
      box.scrollTop = box.scrollHeight;
    }

    // Modal Lightbox Functions
    function openModal(index) {
      if (!currentPreviews || currentPreviews.length === 0) return;
      currentIndex = index;
      updateModalContent();
      const modal = document.getElementById('imageModal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('modalImg').src = '';
      }, 200);
    }

    function updateModalContent() {
      const modalImg = document.getElementById('modalImg');
      const counter = document.getElementById('modalCounter');
      modalImg.src = currentPreviews[currentIndex];
      counter.innerText = `${currentIndex + 1} / ${currentPreviews.length}`;
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      if (currentPreviews.length === 0) return;
      currentIndex = (currentIndex + 1) % currentPreviews.length;
      updateModalContent();
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      if (currentPreviews.length === 0) return;
      currentIndex = (currentIndex - 1 + currentPreviews.length) % currentPreviews.length;
      updateModalContent();
    }

    // Global Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('imageModal');
      const isModalOpen = !modal.classList.contains('hidden');

      if (isModalOpen) {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
      }
    });

    async function runPipeline() {
      const promptInput = document.getElementById('prompt');
      const prompt = promptInput.value.trim();
      const count = parseInt(document.getElementById('count').value);
      if (!prompt) return;

      const btn = document.getElementById('genBtn');
      const statusContainer = document.getElementById('statusContainer');
      const statusLabel = document.getElementById('statusLabel');
      const progressBar = document.getElementById('progressBar');
      const resultContainer = document.getElementById('resultContainer');
      const detailsBox = document.getElementById('detailsBox');
      const previewGrid = document.getElementById('previewGrid');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      statusContainer.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      detailsBox.innerHTML = '';
      previewGrid.innerHTML = '';
      progressBar.style.width = '15%';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, target_count: count })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const messages = buffer.split('\n\n');
          buffer = messages.pop();

          for (const message of messages) {
            const line = message.trim();
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));

              if (data.status) {
                statusLabel.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-pulse"></span> ${data.status}`;
                addLogDetail(data.status);

                if (data.status.includes('Analyzing')) progressBar.style.width = '30%';
                if (data.status.includes('Fetching')) progressBar.style.width = '55%';
                if (data.status.includes('Verified')) progressBar.style.width = '85%';
              }

              if (data.queries) {
                data.queries.forEach(q => addLogDetail(`• ${q}`));
              }

              if (data.complete) {
                progressBar.style.width = '100%';
                statusContainer.classList.add('hidden');
                
                document.getElementById('resultDesc').innerText = `${data.count} references packed into canvas. PureRef opened automatically.`;
                document.getElementById('downloadLink').href = data.download_url;
                
                // Store previews and render gallery
                if (data.previews && data.previews.length > 0) {
                  currentPreviews = data.previews;
                  previewGrid.innerHTML = '';
                  data.previews.forEach((url, idx) => {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'aspect-square rounded-lg overflow-hidden bg-zinc-950 border border-zinc-800 relative group cursor-zoom-in';
                    imgDiv.onclick = () => openModal(idx);
                    imgDiv.innerHTML = `
                      <img src="${url}" loading="lazy" 
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-200" 
                        onerror="this.parentElement.style.display='none'">
                      <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition flex items-center justify-center opacity-0 group-hover:opacity-100">
                        <svg class="w-4 h-4 text-white drop-shadow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                        </svg>
                      </div>
                    `;
                    previewGrid.appendChild(imgDiv);
                  });
                }

                resultContainer.classList.remove('hidden');
              }

              if (data.error) {
                statusLabel.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> ${data.error}`;
                addLogDetail(`Error: ${data.error}`);
              }
            }
          }
        }
      } catch (err) {
        statusLabel.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> Request failed.`;
        addLogDetail(`Error: ${err}`);
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }
  </script>
</body>
</html>
