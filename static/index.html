<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assemblage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Two worlds this tool sits between. The left side borrows Blender's sidebar
     (panels, property rows, dark inset fields); the right side is a PureRef-like
     canvas, so the preview reads the way the board will when it opens. */
  :root{
    --canvas:#2b2b2b;
    --side:#303030;
    --panel:#383838;
    --panel-head:#333333;
    --edge:#222222;
    --widget:#545454;
    --widget-hover:#636363;
    --field:#1f1f1f;
    --field-edge:#171717;
    --text:#e6e6e6;
    --text-2:#c8c8c8;
    --muted:#a8a8a8;
    --accent:#4772b3;          /* Blender's active blue */
    --accent-hover:#5582c4;
    --amber:#d9a441;           /* markup: hints, edited searches */
    --note-bg:#3e3526;
    --note-edge:#6a5632;
    --note-text:#f1e2bf;
    --alert:#f08a78;
    --alert-bg:#3d2825;
    --r:4px;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  a{color:#8fb0e3}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;background:#262626;border-bottom:1px solid var(--edge);flex-shrink:0}
  .brand{font-weight:600;font-size:15px}
  .topbar-sub{color:var(--muted);font-size:13px}
  .topbar-btn{margin-left:auto;background:var(--widget);border:1px solid var(--edge);border-radius:var(--r);padding:4px 11px;font-size:13px;cursor:pointer}
  .topbar-btn:hover{background:var(--widget-hover)}
  @media(max-width:560px){ .topbar-sub{display:none} }

  /* ---------- app shell ---------- */
  .app{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
  .app > *{min-width:0}   /* grid children default to min-width:auto and push past the viewport */
  @media(min-width:900px){
    .app{grid-template-columns:390px minmax(0,1fr);height:calc(100vh - 44px)}
    .side-scroll{overflow:auto}
    .canvas{overflow:auto}
  }

  .side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--edge)}
  .side-scroll{flex:1;padding:8px}
  .side-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel-head);border-top:1px solid var(--edge)}

  /* ---------- panels ---------- */
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:8px}
  .panel[hidden]{display:none}
  .panel > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel-head);border-radius:var(--r);font-weight:500;font-size:13.5px;user-select:none}
  .panel[open] > summary{border-bottom:1px solid var(--edge);border-radius:var(--r) var(--r) 0 0}
  .panel > summary::-webkit-details-marker{display:none}
  .panel > summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
  .panel[open] > summary::before{transform:rotate(90deg)}
  .panel > summary .aside{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
  .panel-body{padding:10px}

  .field-label{display:block;font-size:13px;color:var(--text-2);margin-bottom:5px}
  #prompt{width:100%;min-height:58px;resize:vertical;background:var(--field);border:1px solid var(--field-edge);border-radius:var(--r);padding:8px 9px;font-size:14.5px;line-height:1.4}
  #prompt::placeholder{color:#7d7d7d}

  .props{margin-top:9px;display:grid;gap:3px}
  .prop{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;font-size:13px}
  .prop-k{color:var(--muted);text-align:right}
  .prop-v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* hints: markup, amber */
  .note{background:var(--note-bg);border:1px solid var(--note-edge);border-radius:var(--r);padding:8px 10px;color:var(--note-text);font-size:13px}
  .note + .note{margin-top:7px}
  .note .chips{margin-top:7px}

  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:var(--widget);border:1px solid var(--edge);border-radius:var(--r);padding:2px 8px;font-size:12.5px;cursor:pointer;color:var(--text)}
  .chip:hover{background:var(--widget-hover)}
  .note .chip{background:#57492f;border-color:var(--note-edge);color:var(--note-text)}
  .note .chip:hover{background:#6a5838}

  /* searches */
  .sub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .srow + .srow{margin-top:9px}
  .srow-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;min-width:0}
  .srow-name{font-size:13px;font-weight:500;white-space:nowrap}
  .srow-desc{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Searches wrap and grow rather than scroll sideways: they are the thing
     the user is meant to read and correct, so none of it may be hidden. */
  .srow textarea{display:block;width:100%;resize:none;overflow:hidden;background:var(--field);border:1px solid var(--field-edge);border-radius:var(--r);padding:5px 8px;font-family:var(--mono);font-size:12.5px;line-height:1.45}
  .srow.edited textarea{border-color:var(--amber)}
  .srow.off .srow-name{color:var(--muted);text-decoration:line-through}
  .srow.off .srow-desc{visibility:hidden}
  .link-btn{background:none;border:0;padding:0;color:#8fb0e3;font-size:12.5px;text-decoration:underline;cursor:pointer}
  .link-btn[hidden]{display:none}

  /* tips */
  .tip + .tip{margin-top:11px;padding-top:11px;border-top:1px solid #444}
  .tip-title{font-weight:500;font-size:13.5px}
  .tip-text{color:var(--text-2);font-size:13px;margin-top:2px}
  .tip-ex{font-size:13px;color:var(--text-2);margin-top:5px;line-height:1.9}
  .tip-ex .before{color:var(--muted)}
  .tip-ex .chip{margin-left:2px}
  .tip-group{margin-top:13px;padding-top:11px;border-top:1px solid #444}
  .seg{display:flex;flex-wrap:wrap;background:var(--field);border:1px solid var(--field-edge);border-radius:var(--r);padding:2px;gap:2px;margin:6px 0 7px}
  .seg button{flex:1;background:none;border:0;border-radius:3px;padding:3px 6px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}
  .seg button[aria-selected="true"]{background:var(--widget);color:var(--text)}

  /* footer controls */
  .count{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .count output{min-width:20px;font-variant-numeric:tabular-nums;color:var(--text)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:2px;background:var(--field);cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text-2)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text-2)}
  .primary{background:var(--accent);border:1px solid #2f5390;border-radius:var(--r);padding:6px 16px;font-weight:500;color:#fff;cursor:pointer}
  .primary:hover:not(:disabled){background:var(--accent-hover)}
  .primary:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- canvas ---------- */
  .canvas{padding:18px 22px 40px}
  .bar-area{max-width:1400px;margin-bottom:14px}
  .status,.result,.error{border-radius:var(--r);padding:9px 12px;font-size:13.5px;margin-bottom:10px}
  .status{background:#353535;border:1px solid var(--edge)}
  .result{background:#353535;border:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .error{background:var(--alert-bg);border:1px solid #6b3a33;color:var(--alert)}
  .status[hidden],.result[hidden],.error[hidden],.intro[hidden]{display:none}
  .track{height:3px;background:var(--field);border-radius:2px;margin-top:7px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .download{background:var(--widget);border:1px solid var(--edge);border-radius:var(--r);padding:4px 12px;color:var(--text);text-decoration:none;font-size:13px}
  .download:hover{background:var(--widget-hover)}
  .intro{color:var(--muted);font-size:13.5px;margin-bottom:14px}

  .group{margin-bottom:26px;min-width:0}
  .group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;min-width:0}
  .group-name{font-size:13.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
  .group-desc{font-size:12.5px;color:#8a8a8a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .group-count{font-size:12.5px;color:#8a8a8a;font-variant-numeric:tabular-nums}
  .group-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;min-height:60px}
  .group-empty{font-size:13px;color:#8a8a8a}

  /* images float on the canvas like they will in PureRef: no frames */
  .thumb{height:160px;background:none;border:0;padding:0;cursor:zoom-in;line-height:0;border-radius:2px;outline:1px solid transparent;outline-offset:2px}
  .thumb img{height:100%;width:auto;max-width:300px;object-fit:contain;display:block;opacity:0;transition:opacity .25s ease}
  .thumb img.in{opacity:1}
  .thumb:hover{outline-color:var(--accent)}
  .ghost{height:90px;width:120px;border-radius:2px;background:#333;border:1px dashed #444}
  @media(max-width:560px){ .thumb{height:118px} .thumb img{max-width:200px} .group-desc{display:none} .canvas{padding:14px} }

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(20,20,20,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:62px 22px 26px}
  .lb[hidden]{display:none}
  .lb img{max-width:100%;max-height:100%;object-fit:contain}
  .lb-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 16px;font-size:13.5px}
  .lb-meta{display:flex;gap:18px;align-items:baseline;min-width:0}
  .lb-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-meta .strong{font-weight:500}
  .lb-meta .dim{color:var(--muted)}
  .lb-actions{display:flex;gap:7px;flex-shrink:0}
  .lb-btn{background:var(--widget);border:1px solid var(--edge);border-radius:var(--r);padding:4px 11px;font-size:13px;color:var(--text);cursor:pointer;text-decoration:none}
  .lb-btn:hover{background:var(--widget-hover)}
  .lb-btn[hidden]{display:none}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--widget);border:1px solid var(--edge);border-radius:var(--r);width:38px;height:54px;font-size:18px;color:var(--text);cursor:pointer}
  .lb-nav:hover{background:var(--widget-hover)}
  .lb-prev{left:14px}.lb-next{right:14px}

  @media(prefers-reduced-motion:reduce){ *{transition:none !important} .thumb img{opacity:1} }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Assemblage</span>
  <span class="topbar-sub">Reference boards for PureRef</span>
  <button class="topbar-btn" id="tipsBtn" type="button" aria-controls="tipsPanel">Prompt tips</button>
</header>

<div class="app">
  <aside class="side" aria-label="Build a board">
    <div class="side-scroll">

      <details class="panel" open>
        <summary>Subject</summary>
        <div class="panel-body">
          <label class="field-label" for="prompt">What are you modelling?</label>
          <textarea id="prompt" rows="2" placeholder="One object or part, like a porch column base"></textarea>
          <div class="props" aria-live="polite">
            <div class="prop"><span class="prop-k">Read as</span><span class="prop-v" id="kindVal">Nothing yet</span></div>
            <div class="prop"><span class="prop-k">Subject</span><span class="prop-v" id="subjectVal">None</span></div>
          </div>
        </div>
      </details>

      <details class="panel" id="notesPanel" open hidden>
        <summary>Worth a second look</summary>
        <div class="panel-body" id="notes" aria-live="polite"></div>
      </details>

      <details class="panel" id="searchPanel" open hidden>
        <summary>Searches <button class="link-btn aside" id="resetAll" type="button" hidden>Reset all</button></summary>
        <div class="panel-body">
          <p class="sub">Edit any search. Clear one to skip that group.</p>
          <div id="searchRows"></div>
        </div>
      </details>

      <details class="panel" id="tipsPanel">
        <summary>Prompt tips</summary>
        <div class="panel-body" id="tipsBody"></div>
      </details>

    </div>
    <div class="side-foot">
      <label class="count">Images
        <input id="count" type="range" min="4" max="24" step="4" value="12">
        <output id="countOut" for="count">12</output>
      </label>
      <button class="primary" id="buildBtn" type="button" disabled title="Enter in the prompt box, or Ctrl+Enter anywhere">Build board</button>
    </div>
  </aside>

  <main class="canvas" aria-label="Board preview">
    <div class="bar-area">
      <div class="status" id="status" hidden aria-live="polite">
        <span id="statusText">Starting</span>
        <div class="track"><div class="bar" id="bar"></div></div>
      </div>
      <div class="error" id="error" hidden role="alert"></div>
      <div class="result" id="result" hidden>
        <span id="resultText"></span>
        <a class="download" id="download" href="#" download>Download .pur</a>
      </div>
    </div>
    <p class="intro" id="intro">Your board appears here, grouped the way it will open in PureRef.</p>
    <div id="bands"></div>
  </main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Reference image">
  <div class="lb-bar">
    <div class="lb-meta">
      <span class="strong" id="lbSlot"></span>
      <span class="dim" id="lbPos"></span>
      <span class="dim" id="lbHost"></span>
    </div>
    <div class="lb-actions">
      <a class="lb-btn" id="lbOpen" href="#" target="_blank" rel="noopener noreferrer">Open original</a>
      <button class="lb-btn" id="lbCopy" type="button">Copy link</button>
      <button class="lb-btn" id="lbClose" type="button">Close</button>
    </div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous image">&#8592;</button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next image">&#8594;</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
"use strict";

/* Each tip pairs a vague prompt with a better one. The better one is a button,
   so a tip is also a one-click example of the habit it teaches. */
const TIPS = [
  {title:"One object, not a whole scene",
   text:"Boards work best on a single thing. Search the pieces of a scene one at a time.",
   examples:[["kitchen", "kitchen cabinet door hinge"]]},
  {title:"Name the part you are modelling",
   text:"If you only need the handle, ask for the handle.",
   examples:[["sword", "sword crossguard"]]},
  {title:"Say what is there, not how it feels",
   text:"Mood words like liminal or creepy bring back game screenshots and AI art.",
   examples:[["creepy hallway", "hotel corridor carpet"]]},
  {title:"Add a material or a style",
   text:"A little detail narrows the results a lot.",
   examples:[["chair", "bentwood oak chair"]]},
  {title:"Use the trade name if you know it",
   text:"Specific names find specific objects.",
   examples:[["stage light", "fresnel stage light"], ["ceiling panels", "acoustic ceiling tile"]]},
  {title:"Add floor plan for room layouts",
   text:"It switches to plan mode: simple, dimensioned, furnished and 3D cutaway plans.",
   examples:[["office layout", "office suite floor plan"]]},
  {title:"Check the searches before you build",
   text:"Every search is editable. Clear one to skip that group, and if one group comes back wrong, reword only that search.",
   examples:[]}
];

/* Example prompts by kind of work. Each is the specific, physical kind of
   phrase that searches well. */
const STARTERS = {
  "Level design": ["tenant improvement floor plan", "office suite floor plan", "school floor plan", "motel floor plan"],
  "Architecture": ["crown molding profile", "porch column base", "drop ceiling grid", "door casing trim"],
  "Props":        ["fresnel stage light", "steel filing cabinet", "office swivel chair", "vending machine"],
  "Materials":    ["commercial carpet tile", "acoustic ceiling tile", "painted cinder block", "vinyl floor tile"]
};

const DEFAULT_SLOTS = [
  {id:"hero",     label:"Form & silhouette",        description:"the whole object, three-quarter view"},
  {id:"ortho",    label:"Orthographic & technical", description:"blueprints, elevations and cross-sections"},
  {id:"detail",   label:"Joinery & construction",   description:"corners, seams, how it goes together"},
  {id:"material", label:"Material & surface",       description:"texture, wear and roughness up close"}
];

const STAGE_TEXT = {1:"Reading the subject", 2:"Running the searches", 3:"Searching",
                    4:"Filtering what came back", 5:"Sorting into groups", 6:"Packing the board"};
const STAGES = 6;

const $ = id => document.getElementById(id);

const state = {
  plan:null, rows:[], slotsShown:DEFAULT_SLOTS, previews:[], hasBoard:false,
  running:false, planSeq:0, planCtrl:null, planAvailable:true, lb:0
};

/* ---------------- helpers ---------------- */

function el(tag, props, children){
  const n = document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v]) => {
    if(k === "text") n.textContent = v;
    else if(k === "class") n.className = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  });
  (children || []).forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}

/* Source URLs come from the open web. Only http(s) may become a link;
   javascript: or data: would run inside this page when clicked. */
function safeHref(u){
  try{ const p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : null; }
  catch(e){ return null; }
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } }

/* Remembering whether the tips panel is open. localStorage can be unavailable
   (private windows, strict settings), so every access is guarded. */
function remember(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }
function recall(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }

/* ---------------- tips ---------------- */

function buildTips(){
  const body = $("tipsBody");
  TIPS.forEach(t => {
    const tip = el("div", {class:"tip"}, [
      el("p", {class:"tip-title", text:t.title}),
      el("p", {class:"tip-text", text:t.text})
    ]);
    t.examples.forEach(([before, after]) => {
      tip.appendChild(el("p", {class:"tip-ex"}, [
        "Instead of ", el("span", {class:"before", text:before}), ", try",
        el("button", {class:"chip", type:"button", text:after, onclick:() => usePrompt(after)})
      ]));
    });
    body.appendChild(tip);
  });

  const group = el("div", {class:"tip-group"}, [el("p", {class:"tip-title", text:"Examples by kind of work"})]);
  const seg = el("div", {class:"seg", role:"tablist", "aria-label":"Kinds of work"});
  const chips = el("div", {class:"chips"});
  Object.keys(STARTERS).forEach((name, i) => {
    seg.appendChild(el("button", {type:"button", role:"tab", text:name,
      "aria-selected": i === 0 ? "true" : "false",
      onclick: () => showStarters(name, seg, chips)}));
  });
  group.appendChild(seg); group.appendChild(chips);
  body.appendChild(group);
  showStarters(Object.keys(STARTERS)[0], seg, chips);

  // Open on first visit; after that, remember what the user chose.
  const saved = recall("assemblage.tipsOpen");
  $("tipsPanel").open = saved === null ? true : saved === "1";
  $("tipsPanel").addEventListener("toggle", () => remember("assemblage.tipsOpen", $("tipsPanel").open ? "1" : "0"));
}

function showStarters(name, seg, chips){
  seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.textContent === name ? "true" : "false"));
  chips.replaceChildren(...STARTERS[name].map(text =>
    el("button", {class:"chip", type:"button", text, onclick:() => usePrompt(text)})));
}

function usePrompt(text){
  $("prompt").value = text;
  $("prompt").focus();
  onPromptInput(true);
}

/* ---------------- planning (search preview) ---------------- */

let planTimer = null;

function onPromptInput(immediate){
  const v = $("prompt").value.trim();
  syncBuildButton();
  clearTimeout(planTimer);
  if(!v){ clearPlan(); return; }
  planTimer = setTimeout(requestPlan, immediate === true ? 0 : 280);
}

function requestPlan(){
  if(!state.planAvailable) return null;
  const prompt = $("prompt").value.trim();
  if(!prompt) return null;
  if(state.planCtrl) state.planCtrl.abort();
  const ctrl = new AbortController();
  state.planCtrl = ctrl;
  const seq = ++state.planSeq;

  return fetch("/api/plan", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt}), signal:ctrl.signal
  }).then(res => {
    if(res.status === 404){ state.planAvailable = false; return null; }
    if(!res.ok) throw new Error("plan " + res.status);
    return res.json();
  }).then(plan => {
    // A slower, older answer must never overwrite a newer one.
    if(!plan || seq !== state.planSeq) return;
    applyPlan(plan);
  }).catch(err => { if(err.name !== "AbortError") console.warn("plan failed", err); });
}

function clearPlan(){
  state.plan = null; state.rows = [];
  $("searchPanel").hidden = true;
  $("notesPanel").hidden = true;
  $("kindVal").textContent = "Nothing yet";
  $("subjectVal").textContent = "None";
  if(!state.hasBoard) renderSkeleton(DEFAULT_SLOTS);
}

function applyPlan(plan){
  if(!plan.mode){ clearPlan(); return; }
  const sameSlots = state.rows.length === plan.slots.length &&
                    state.rows.every((r, i) => r.id === plan.slots[i].id);
  const generated = Object.fromEntries(plan.queries.map(q => [q.slot, q.query]));

  // Keep searches the user edited, as long as the groups did not change
  // underneath them. Unedited rows follow the prompt.
  state.rows = plan.slots.map((s, i) => {
    const prev = sameSlots ? state.rows[i] : null;
    const gen = generated[s.id] || "";
    if(prev && prev.edited) return {...s, generated:gen, value:prev.value, edited:true};
    return {...s, generated:gen, value:gen, edited:false};
  });
  state.plan = plan;
  // Show how the prompt was understood, not an echo of what was typed.
  $("kindVal").textContent = plan.kind_label || plan.mode_label;
  $("subjectVal").textContent = plan.subject || "None";
  renderNotes(plan.hints || []);
  renderRows();
  if(!state.hasBoard) renderSkeleton(plan.slots);
}

function renderNotes(hints){
  $("notes").replaceChildren(...hints.map(h => {
    const note = el("div", {class:"note"}, [el("p", {text:h.text})]);
    if(h.suggestions && h.suggestions.length){
      note.appendChild(el("div", {class:"chips"}, h.suggestions.map(sug =>
        el("button", {class:"chip", type:"button", text:sug, onclick:() => usePrompt(sug)}))));
    }
    return note;
  }));
  $("notesPanel").hidden = hints.length === 0;
}

function renderRows(){
  $("searchRows").replaceChildren(...state.rows.map(row => {
    const input = el("textarea", {rows:"1", spellcheck:"false", autocomplete:"off",
                                  placeholder:"Skipped", "aria-label":row.label + " search"});
    input.value = row.value;
    // Grow to fit the text. Enter builds the board: a search is one line.
    // scrollHeight leaves out the borders, and the box's height includes them,
    // so the border width is added back; without it the text is clipped by 2px.
    const fit = () => {
      input.style.height = "auto";
      input.style.height = (input.scrollHeight + input.offsetHeight - input.clientHeight) + "px";
    };
    input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); build(); } });
    requestAnimationFrame(fit);
    const reset = el("button", {class:"link-btn", type:"button", text:"Reset"});
    const wrap = el("div", {class:"srow"}, [
      el("div", {class:"srow-head"}, [
        el("span", {class:"srow-name", text:row.label}),
        el("span", {class:"srow-desc", text:row.description}),
        reset
      ]),
      input
    ]);
    const paint = () => {
      wrap.classList.toggle("edited", row.edited);
      wrap.classList.toggle("off", !row.value.trim());
      reset.hidden = !row.edited;
    };
    input.addEventListener("input", () => {
      fit();
      row.value = input.value;
      row.edited = row.value !== row.generated;
      paint(); syncResetAll(); syncBuildButton();
    });
    reset.addEventListener("click", () => {
      row.value = row.generated; row.edited = false;
      input.value = row.value; fit(); paint(); syncResetAll(); syncBuildButton(); input.focus();
    });
    paint();
    return wrap;
  }));
  $("searchPanel").hidden = state.rows.length === 0;
  syncResetAll();
}

function syncResetAll(){ $("resetAll").hidden = !state.rows.some(r => r.edited); }

function syncBuildButton(){
  const hasPrompt = $("prompt").value.trim().length > 0;
  const anySearch = state.rows.length === 0 || state.rows.some(r => r.value.trim());
  $("buildBtn").disabled = state.running || !hasPrompt || !anySearch;
}

/* ---------------- canvas ---------------- */

function groupFor(slot, rowNodes, countText){
  return el("section", {class:"group", "data-slot":slot.id}, [
    el("div", {class:"group-head"}, [
      el("span", {class:"group-name", text:slot.label}),
      el("span", {class:"group-desc", text:slot.description || ""}),
      el("span", {class:"group-count", text:countText})
    ]),
    el("div", {class:"group-row"}, rowNodes)
  ]);
}

function renderSkeleton(slots){
  state.slotsShown = slots;
  $("bands").replaceChildren(...slots.map(s =>
    groupFor(s, [el("div",{class:"ghost"}), el("div",{class:"ghost"}), el("div",{class:"ghost"})], "")));
}

function renderBoard(){
  $("bands").replaceChildren(...state.slotsShown.map(slot => {
    const mine = state.previews.filter(p => p.slot === slot.id);
    if(!mine.length){
      return groupFor(slot, [el("p", {class:"group-empty",
        text:"Nothing usable came back for this group. Try rewording its search."})], "0");
    }
    return groupFor(slot, mine.map(item => {
      const idx = state.previews.indexOf(item);
      const img = el("img", {alt:"", loading:"lazy"});
      img.addEventListener("load", () => img.classList.add("in"));
      const btn = el("button", {class:"thumb", type:"button",
                                "aria-label":slot.label + " image " + (idx + 1) + ", open larger",
                                onclick:() => openLb(idx)}, [img]);
      img.addEventListener("error", () => btn.remove());
      img.src = item.url;
      return btn;
    }), String(mine.length));
  }));
}

/* Older servers sent previews as bare URL strings with no group. */
function normalisePreviews(raw){
  const list = raw || [];
  if(list.length && typeof list[0] === "string"){
    state.slotsShown = [{id:"_all", label:"References", description:"update app.py to group these"}];
    return list.map(u => ({url:u, slot:"_all", label:"Reference", source:""}));
  }
  return list;
}

/* ---------------- building ---------------- */

function setStage(n){
  $("statusText").textContent = STAGE_TEXT[n] || "Working";
  $("bar").style.width = Math.round(n / STAGES * 100) + "%";
}
function showError(msg){ $("error").textContent = msg; $("error").hidden = false; }

async function build(){
  const prompt = $("prompt").value.trim();
  if(!prompt || state.running) return;

  // Make sure the searches match what was just typed before building.
  clearTimeout(planTimer);
  if(state.planAvailable){ const pending = requestPlan(); if(pending) await pending; }

  state.running = true; syncBuildButton();
  $("error").hidden = true; $("result").hidden = true; $("intro").hidden = true;
  $("status").hidden = false; setStage(1);

  const body = {prompt, target_count:parseInt($("count").value, 10)};
  if(state.rows.length) body.queries = state.rows.map(r => ({slot:r.id, query:r.value}));
  const planned = state.rows.filter(r => r.value.trim()).map(({id,label,description}) => ({id,label,description}));
  if(planned.length) renderSkeleton(planned);

  try{
    const res = await fetch("/api/generate", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
    });
    if(!res.ok){
      let detail = "The server returned " + res.status + ".";
      try{ const j = await res.json(); if(j.detail) detail = typeof j.detail === "string" ? j.detail : "Some searches were not valid."; }catch(e){}
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let finished = false;   // set once the server says it completed or failed
    while(true){
      const chunk = await reader.read();
      if(chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      const frames = buffer.split("\n\n");
      buffer = frames.pop();          // the last piece may be half an update
      for(const frame of frames){
        const line = frame.trim();
        if(!line.startsWith("data: ")) continue;
        const data = JSON.parse(line.slice(6));
        if(data.stage) setStage(data.stage);
        if(data.slots && data.slots.length) renderSkeleton(data.slots);
        if(data.error){ finished = true; showError(data.error); $("status").hidden = true; }
        if(data.complete){
          finished = true;
          $("status").hidden = true;
          state.previews = normalisePreviews(data.previews);
          state.hasBoard = true;
          renderBoard();
          $("resultText").textContent = data.count + " images, opened in PureRef.";
          $("download").href = data.download_url;
          $("result").hidden = false;
        }
      }
    }
    if(!finished){
      $("status").hidden = true;
      showError("The server stopped partway through without saying why. Check the window running Assemblage.");
    }
  }catch(err){
    $("status").hidden = true;
    showError(err.message && !/Failed to fetch|NetworkError/.test(err.message)
      ? err.message
      : "Lost the connection to the server. Check that it is still running.");
  }finally{
    state.running = false; syncBuildButton();
  }
}

/* ---------------- lightbox ---------------- */

function openLb(i){
  if(!state.previews.length) return;
  state.lb = i; paintLb(); $("lb").hidden = false; $("lbClose").focus();
}
function paintLb(){
  const item = state.previews[state.lb];
  $("lbImg").src = item.url;
  $("lbSlot").textContent = item.label || "";
  $("lbPos").textContent = (state.lb + 1) + " of " + state.previews.length;
  $("lbHost").textContent = hostOf(item.source);
  const href = safeHref(item.source);
  $("lbOpen").hidden = !href; $("lbCopy").hidden = !href;
  if(href) $("lbOpen").href = href;
}
function closeLb(){ $("lb").hidden = true; $("lbImg").src = ""; }
function stepLb(d){ state.lb = (state.lb + d + state.previews.length) % state.previews.length; paintLb(); }

/* ---------------- wiring ---------------- */

buildTips();
renderSkeleton(DEFAULT_SLOTS);

$("prompt").addEventListener("input", () => onPromptInput(false));
$("prompt").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); build(); } });
$("count").addEventListener("input", e => { $("countOut").textContent = e.target.value; });
$("buildBtn").addEventListener("click", build);
$("resetAll").addEventListener("click", e => {
  e.preventDefault();          // the button sits inside a <summary>; don't collapse the panel
  state.rows.forEach(r => { r.value = r.generated; r.edited = false; });
  renderRows(); syncBuildButton();
});
$("tipsBtn").addEventListener("click", () => {
  $("tipsPanel").open = true;
  $("tipsPanel").scrollIntoView({behavior:"smooth", block:"start"});
  $("tipsPanel").querySelector("summary").focus({preventScroll:true});
});

$("lbClose").addEventListener("click", closeLb);
$("lbPrev").addEventListener("click", () => stepLb(-1));
$("lbNext").addEventListener("click", () => stepLb(1));
$("lb").addEventListener("click", e => { if(e.target === $("lb")) closeLb(); });
$("lbCopy").addEventListener("click", async () => {
  const href = safeHref(state.previews[state.lb].source);
  try{ await navigator.clipboard.writeText(href); $("lbCopy").textContent = "Copied"; }
  catch(e){ $("lbCopy").textContent = "Copy failed"; }
  setTimeout(() => { $("lbCopy").textContent = "Copy link"; }, 1400);
});

document.addEventListener("keydown", e => {
  if(!$("lb").hidden){
    if(e.key === "Escape") closeLb();
    if(e.key === "ArrowRight") stepLb(1);
    if(e.key === "ArrowLeft") stepLb(-1);
    return;
  }
  if((e.ctrlKey || e.metaKey) && e.key === "Enter") build();
});
</script>
</body>
</html>
